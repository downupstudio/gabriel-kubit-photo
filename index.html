<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHOTOS</title>
<meta name="description" content="Photography">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">
  <div class="breadcrumb" id="breadcrumb"></div>
</nav>

<main class="explorer">
  <section class="explorer__main" id="explorerMain">
    <p class="loading">Loading…</p>
  </section>
  <aside class="explorer__desc" id="explorerDesc"></aside>
</main>

<noscript>
  <div class="noscript">
    This site needs JavaScript to display the photo explorer.
  </div>
</noscript>

<div class="lightbox" id="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lightbox__bar">
    <span class="lightbox__counter" id="lbCounter"></span>
    <button class="lightbox__close" id="lbClose">CLOSE</button>
  </div>
  <div class="lightbox__body">
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">&#8592;</button>
    <div class="lightbox__stage">
      <img class="lightbox__img" id="lbImg" alt="">
      <div class="lightbox__loader" id="lbLoader" data-visible="false">
        <p>Loading…</p>
      </div>
    </div>
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">&#8594;</button>
  </div>
  <div class="lightbox__foot">
    <p class="lightbox__title" id="lbTitle"></p>
    <p class="lightbox__desc" id="lbDesc"></p>
  </div>
</div>

<script src="assets/app.js" type="module"></script>
</body>
</html>
